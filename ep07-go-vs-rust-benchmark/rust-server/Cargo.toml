[package]
name = "rust-server"
version = "0.1.0"
edition = "2021"
authors = ["Benchmark Specialist <perf@benchmark.internal>"]
description = "High-throughput tokenization service in Rust with zero-copy BPE execution"

[dependencies]
axum = { version = "0.7", default-features = false, features = ["tokio", "http1", "http2", "json"] }
tokio = { version = "1.38", features = ["rt-multi-thread", "macros", "signal", "sync", "time"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tiktoken-rs = "0.5"
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
